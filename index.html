<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<title>刷题助手 · Grind</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --ink:#1b2230; --muted:#7b8496; --line:#e5e9f0;
  --pri:#2f6fed; --pri-weak:#e8efff; --ok:#12915c; --ok-weak:#e3f7ed;
  --bad:#dc3b41; --bad-weak:#fdeaea; --warn:#b7791f; --warn-weak:#fdf3dc;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:rgba(244,246,249,.92);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
header.top .inner{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand small{font-weight:500;color:var(--muted);margin-left:6px;font-size:12px}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
.iconbtn:hover{border-color:#c9d2e0}
h1{font-size:20px;margin:22px 0 6px}
h2{font-size:16px;margin:22px 0 10px;color:#485064}
p.sub{color:var(--muted);font-size:13px;margin:0 0 16px}

.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s ease}
.sec:active{transform:scale(.995)}
.sec .hd{display:flex;align-items:center;gap:10px}
.sec .nm{font-weight:700;font-size:17px}
.sec .tag{margin-left:auto;font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:#eef1f6;overflow:hidden;margin:12px 0 8px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#5b8cf7,#2f6fed);transition:width .4s ease}
.bar.small{height:6px;margin:10px 0 4px}
.bar.warn>i{background:linear-gradient(90deg,#f0b24a,#e05a2b)}
.sec .st{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.sec .st b{color:var(--ink);font-weight:600}
.dotb{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:1px}
.d-mastered{background:var(--ok)} .d-due{background:var(--bad)} .d-learn{background:var(--pri)} .d-new{background:#cfd6e2}

.gbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:16px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.gc{border:1px solid var(--line);background:#fbfcfe;border-radius:12px;padding:9px 6px;text-align:center;cursor:pointer;font-size:12.5px;color:var(--muted);line-height:1.35}
.gc b{display:block;font-size:14px;color:var(--ink)}
.gc.due{border-color:#f5c2c4;background:var(--bad-weak)} .gc.due b{color:var(--bad)}
.gc.learn{border-color:#c9d8fb;background:var(--pri-weak)} .gc.learn b{color:var(--pri)}
.gc.mastered{border-color:#bfe6d3;background:var(--ok-weak)} .gc.mastered b{color:var(--ok)}

.qhead{display:flex;align-items:center;gap:10px;margin:14px 0 6px}
.qhead .t{font-size:13px;color:var(--muted)}
.badge{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--pri-weak);color:var(--pri);font-weight:600}
.badge.judge{background:var(--warn-weak);color:var(--warn)}
.badge.multi{background:#efe8ff;color:#6b46c1}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.stem{font-size:17px;line-height:1.7;margin:0 0 16px;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 13px;cursor:pointer;transition:.12s;font-size:15.5px;line-height:1.5;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.opt:hover{border-color:#c6d4f0;background:#fafcff}
.opt .k{flex:0 0 24px;height:24px;border-radius:7px;background:#f0f3f8;color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;margin-top:1px}
.opt.sel{border-color:var(--pri);background:var(--pri-weak)} .opt.sel .k{background:var(--pri);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-weak)} .opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-weak)} .opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.62}
.actions{display:flex;gap:10px;margin-top:14px}
button.btn{flex:1;border:0;border-radius:12px;padding:13px 16px;font-size:15.5px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;transition:.12s;touch-action:manipulation}
button.btn:disabled{background:#c8d3e6;cursor:not-allowed}
button.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.btn.ok{background:var(--ok)}
button.btn.danger{background:#fff;color:var(--bad);border:1px solid #f5c2c4}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:14.5px;display:none}
.fb.show{display:block}
.fb.good{background:var(--ok-weak);color:#0b6b44;border:1px solid #bfe6d3}
.fb.bad{background:var(--bad-weak);color:#a5262b;border:1px solid #f5c2c4}
.fb .ans{font-weight:700} .fb .src{color:var(--muted);font-size:12.5px;margin-top:4px}

.res{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);text-align:center;margin-top:20px}
.res .big{font-size:40px;line-height:1}
.res .ttl{font-size:19px;font-weight:700;margin:10px 0 4px}
.res .desc{color:var(--muted);font-size:14px}
.kv{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px dashed var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)} .kv b{font-weight:600}

.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.mini{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
.settings{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:22px;box-shadow:var(--shadow)}
.settings h3{margin:0 0 10px;font-size:14px;color:#485064}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:#3d4658;cursor:pointer;margin:8px 0}
.chk input{width:17px;height:17px;accent-color:var(--pri)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:#1b2230;color:#fff;padding:10px 16px;border-radius:99px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%)}
.hr{height:1px;background:var(--line);margin:16px 0}

/* 题库条 */
.bankbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin:16px 0 4px;box-shadow:var(--shadow)}
.bankbar .nm{font-weight:600;font-size:14.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bankbar .cnt{font-size:12px;color:var(--muted);white-space:nowrap}
select.sel{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14.5px;background:#fff;color:var(--ink)}

/* 错题本 */
.wq{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.wq .h{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.wq .tag{font-size:11px;padding:1px 7px;border-radius:99px;background:#f0f3f8;color:var(--muted)}
.wq .tag.n{background:var(--bad-weak);color:var(--bad);font-weight:600}
.wq .q{font-size:14.5px;line-height:1.6}
.wq .a{font-size:13px;color:var(--ok);margin-top:6px;display:none}
.wq.open .a{display:block}
.wq .a b{color:#0b6b44}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.statgrid .c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.statgrid .c .v{font-size:22px;font-weight:700}
.statgrid .c .l{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}

/* 导入 */
.drop{border:2px dashed #c9d2e0;border-radius:16px;padding:28px 16px;text-align:center;background:#fbfcfe;cursor:pointer;transition:.15s}
.drop.hover{border-color:var(--pri);background:var(--pri-weak)}
.drop .big{font-size:30px}
.drop .t{font-weight:600;margin-top:8px}
.drop .s{font-size:12.5px;color:var(--muted);margin-top:4px}
.report{margin-top:14px;font-size:13.5px}
.report .ok{color:var(--ok)} .report .bad{color:var(--bad)}
.bankitem{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.bankitem:last-child{border-bottom:0}
.bankitem .nm{font-weight:600;font-size:14.5px}
.bankitem .meta{font-size:12px;color:var(--muted)}
.bankitem .act{margin-left:auto;display:flex;gap:6px}
.smallbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.smallbtn.on{border-color:var(--pri);color:var(--pri);font-weight:600}

/* 模拟考试 */
.exambar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:14px 0 8px;box-shadow:var(--shadow)}
.exambar .t{font-weight:600;font-size:15px}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:19px;color:var(--pri);min-width:66px;text-align:right}
.clock.warn{color:var(--bad)}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin:14px 0}
.cn{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;cursor:pointer;color:var(--muted)}
.cn.done{background:var(--pri-weak);border-color:#c9d8fb;color:var(--pri);font-weight:600}
.cn.cur{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-weak);color:var(--ink);font-weight:700}
.rev{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--card);box-shadow:var(--shadow)}
.rev.ok{border-color:#bfe6d3}
.rev.bad{border-color:#f5c2c4}

/* 底部导航 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);
  -webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{display:flex;width:100%;max-width:760px;margin:0 auto}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:8px 0 7px;font-size:11.5px;color:var(--muted);cursor:pointer;background:none;border:0;
  font-family:inherit;touch-action:manipulation}
.tab .ic{font-size:19px;line-height:1.1}
.tab.on{color:var(--pri);font-weight:600}
.tab:active{opacity:.6}
.tab .tbadge{position:absolute;top:3px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;background:var(--bad);color:#fff;font-size:10.5px;line-height:16px;text-align:center}
.tabbar.hide{display:none}

@media (max-width:560px){
  .wrap{padding:0 12px}
  header.top .inner{padding:10px 12px;gap:8px}
  .brand{font-size:15px} .brand small{display:none}
  h1{font-size:18px;margin:16px 0 6px}
  p.sub{font-size:12.5px;margin-bottom:12px;line-height:1.6}
  .sec{padding:12px 13px;border-radius:14px} .sec .nm{font-size:16px} .sec .tag{font-size:11px} .sec .st{gap:10px;font-size:11.5px}
  .ggrid{grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:7px}
  .gc{padding:8px 4px;font-size:11.5px;min-height:56px;display:flex;flex-direction:column;justify-content:center}
  .qcard{padding:14px;border-radius:14px} .stem{font-size:16px;line-height:1.65;margin-bottom:14px}
  .opt{padding:12px 11px;font-size:15px;min-height:50px;border-radius:11px}
  button.btn{padding:14px 12px;font-size:16px;min-height:50px}
  .row .btn{flex:1 1 100%}
  .settings,.bankbar{padding:12px 13px;border-radius:14px}
  .chk{font-size:13px;line-height:1.5;align-items:flex-start}
  .res{padding:18px 14px} .res .big{font-size:34px}
  .toast{font-size:13px;bottom:16px;max-width:88vw;text-align:center}
  .statgrid{grid-template-columns:repeat(3,1fr);gap:8px}
  .statgrid .c{padding:10px 6px} .statgrid .c .v{font-size:19px}
  .exambar{padding:8px 12px;gap:8px;margin:12px 0 6px}
  .exambar .t{font-size:14px}
  .clock{font-size:17px;min-width:56px}
  .cardgrid{grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
  .cn{font-size:13px;border-radius:9px}
  .rev{padding:10px 12px}
  .qhead{gap:8px}
  .qhead .iconbtn{padding:6px 9px;font-size:12px}
  .bankbar{padding:7px 10px}
  select.sel{padding:8px 9px;font-size:14px}
}
@media (max-width:380px){
  .sec .st span:nth-child(2){display:none}
  .ggrid{grid-template-columns:repeat(3,1fr)}
  .stem{font-size:15.5px} .opt{font-size:14.5px}
  .statgrid{grid-template-columns:repeat(3,1fr)}
}
@media (hover:none),(pointer:coarse){ .kbd{display:none} }
</style>
</head>
<body>
<header class="top"><div class="inner">
  <div class="brand">刷题助手<small id="hdrSub"></small></div>
</div></header>
<div class="wrap" id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="toast" id="toast"></div>

<script src="vendor/xlsx.full.min.js"></script>
<script src="js/core.js"></script>
<script src="js/importer.js"></script>
<script src="js/exam.js"></script>
<script src="js/quiz.js"></script>
<script src="js/wrong.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
